<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Раскраска по пикселям — учим таблицу умножения</title>
  <meta name="description" content="Детская раскраска по пикселям с примерами из таблицы умножения и деления" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='45' height='45' fill='%23e53935'/><rect x='55' width='45' height='45' fill='%23fdd835'/><rect y='55' width='45' height='45' fill='%2364b5f6'/><rect x='55' y='55' width='45' height='45' fill='%2366bb6a'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ================= Шапка: выбор картинки, прогресс, действия ================= -->
  <header class="app-header">
    <div class="brand">
      <span class="brand__logo">🎨</span>
      <span class="brand__name">Пиксельная раскраска</span>
    </div>

    <div class="header-controls">
      <label class="picture-select" title="Выбрать картинку">
        <span class="picture-select__label">Картинка</span>
        <select id="pictureSelect" aria-label="Выбор картинки"></select>
      </label>

      <div class="progress" title="Общий прогресс раскрашивания">
        <div class="progress__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress__fill" id="progressFill"></div>
        </div>
        <div class="progress__text">
          <span id="progressText">0%</span>
          <span class="progress__colors" id="progressColors">цвета 0 из 0</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="btnPrintBlank" title="Распечатать чистую раскраску (контуры и числа)">
        🖨️<span class="icon-btn__label">Пустая</span>
      </button>
      <button class="icon-btn" id="btnPrintFull" title="Распечатать полностью закрашенную картинку">
        🖼️<span class="icon-btn__label">Готовая</span>
      </button>
      <button class="icon-btn" id="btnReset" title="Сбросить раскрашенное">
        ↺<span class="icon-btn__label">Сброс</span>
      </button>
      <button class="icon-btn" id="btnSound" title="Включить или выключить звук" aria-pressed="true">🔊</button>
      <button class="icon-btn" id="btnTheme" title="Переключить светлую и тёмную тему">🌙</button>
    </div>
  </header>

  <!-- ================= Рабочая область: канвас (2/3) + панель цветов (1/3) ============ -->
  <main class="workspace">

    <section class="canvas-area" id="canvasArea">
      <div class="paper" id="paper">
        <canvas id="board" aria-label="Поле для раскрашивания"></canvas>
      </div>

      <div class="toast" id="toast" hidden></div>
    </section>

    <aside class="palette-panel">
      <div class="palette-panel__head">
        <h2>Реши пример — найди ответ</h2>
        <p class="palette-panel__sub">Выбери пример, закрась все клеточки с его ответом</p>
      </div>
      <div class="palette-buttons" id="paletteButtons" role="listbox" aria-label="Цвета с примерами"></div>
    </aside>

  </main>

  <!-- Окно «картинка готова» -->
  <div class="win-overlay" id="winOverlay" hidden>
    <div class="win-card">
      <div class="win-card__emoji">🎉</div>
      <h2 class="win-card__title">Ура! Картинка готова!</h2>
      <p class="win-card__text" id="winText"></p>
      <div class="win-card__buttons">
        <button class="btn btn--primary" id="winPrint">🖨️ Распечатать</button>
        <button class="btn" id="winChange">🖼️ Другая картинка</button>
        <button class="btn" id="winClose">Закрыть</button>
      </div>
    </div>
    <div class="confetti" id="confetti"></div>
  </div>

  <!-- Диалог подтверждения сброса -->
  <div class="modal" id="resetModal" hidden>
    <div class="modal__card">
      <h3>Сбросить раскраску?</h3>
      <p>Все закрашенные клеточки снова станут белыми.</p>
      <div class="modal__buttons">
        <button class="btn btn--danger" id="resetConfirm">Да, сбросить</button>
        <button class="btn" id="resetCancel">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Скрытый iframe для печати (без всплывающих окон) -->
  <iframe id="printFrame" title="Печать" aria-hidden="true" tabindex="-1"></iframe>

  <!-- Порядок важен: данные → библиотеки → приложение -->
  <script src="js/embedded-art.js"></script>
  <script src="js/svg-rasterizer.js"></script>
  <script src="js/math-quiz.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
